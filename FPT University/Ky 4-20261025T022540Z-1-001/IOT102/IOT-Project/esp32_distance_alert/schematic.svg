<svg width="500" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f9f9f9"/>
  
  <!-- ESP32 Board -->
  <rect x="150" y="100" width="200" height="200" fill="#2c3e50" rx="10" ry="10"/>
  <text x="250" y="130" font-family="Arial" font-size="16" fill="white" text-anchor="middle">ESP32 DEVKIT</text>
  
  <!-- ESP32 Pins Labels -->
  <text x="140" y="160" font-family="Arial" font-size="12" fill="white" text-anchor="end">GPIO 5 (Trig)</text>
  <text x="140" y="180" font-family="Arial" font-size="12" fill="white" text-anchor="end">GPIO 18 (Echo)</text>
  <text x="140" y="240" font-family="Arial" font-size="12" fill="white" text-anchor="end">GPIO 2 (LED)</text>
  <text x="140" y="260" font-family="Arial" font-size="12" fill="white" text-anchor="end">GPIO 4 (Buzzer)</text>
  <text x="140" y="280" font-family="Arial" font-size="12" fill="white" text-anchor="end">GND</text>
  <text x="140" y="300" font-family="Arial" font-size="12" fill="white" text-anchor="end">5V</text>

  <!-- HC-SR04 Sensor -->
  <rect x="50" y="150" width="80" height="60" fill="#3498db" rx="5" ry="5"/>
  <text x="90" y="185" font-family="Arial" font-size="12" fill="white" text-anchor="middle">HC-SR04</text>
  
  <!-- Wires for HC-SR04 -->
  <line x1="130" y1="160" x2="150" y2="160" stroke="#e74c3c" stroke-width="2"/> <!-- Trig -->
  <line x1="130" y1="180" x2="150" y2="180" stroke="#f1c40f" stroke-width="2"/> <!-- Echo -->
  <line x1="90" y1="210" x2="90" y2="280" stroke="black" stroke-width="2"/> <!-- GND to ESP32 GND line -->
  <line x1="90" y1="150" x2="90" y2="120" stroke="red" stroke-width="2"/> <!-- VCC to ESP32 5V line -->

  <!-- LED -->
  <circle cx="380" cy="240" r="10" fill="#e74c3c"/>
  <text x="380" y="270" font-family="Arial" font-size="12" fill="black" text-anchor="middle">LED</text>
  <line x1="350" y1="240" x2="370" y2="240" stroke="#2ecc71" stroke-width="2"/> <!-- Wire to GPIO 2 -->
  <line x1="380" y1="250" x2="380" y2="280" stroke="black" stroke-width="2"/> <!-- GND -->

  <!-- Buzzer -->
  <rect x="360" y="290" width="40" height="30" fill="#9b59b6" rx="5" ry="5"/>
  <text x="380" y="310" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Buzzer</text>
  <line x1="350" y1="260" x2="350" y2="290" stroke="#9b59b6" stroke-width="2"/> <!-- Wire to GPIO 4 -->
  <line x1="380" y1="320" x2="380" y2="340" stroke="black" stroke-width="2"/> <!-- GND -->

  <!-- Common GND Line -->
  <line x1="90" y1="280" x2="380" y2="280" stroke="black" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="235" y="295" font-family="Arial" font-size="10" fill="black" text-anchor="middle">Common GND</text>

</svg>